name: Package and sign

on: [push]

jobs:
  build:
    permissions:
      id-token: write
      contents: read
      attestations: write

    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 13154362219 \
            --repo prefix-dev/rattler-build \
            --name rattler-build-x86_64-unknown-linux-musl.tar.gz

          # List files to see what we downloaded
          ls -la

          # Extract the tar.gz file
          # Assuming there's only one .tar.gz file
          tar -xzf *.tar.gz

          # List extracted contents
          ls -la
          tree 
          mv rattler-build-x86_64-unknown-linux-musl/rattler-build rattler-build
          chmod +x rattler-build

      - name: Build the package with rattler-build
        run: |
          ./rattler-build build --recipe ./conda.recipe
          tree
      - uses: actions/attest@v1
        id: attest
        with:
          subject-path: "**/*.conda"
          predicate-type: "https://example.com/predicates/conda-package"
          predicate: "{}"

      - name: Upload the package
        run: |
          ./rattler-build upload prefix -c wolf-private-test ./output/**/*.conda --attestation ${{ steps.attest.outputs.bundle-path }}
